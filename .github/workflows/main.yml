name: Build LawRun Kernel

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev zip unzip git binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-9 g++-9

      - name: Build Kernel and Modules
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export HOSTCC=gcc-9
          export HOSTCXX=g++-9
          export LD=aarch64-linux-gnu-ld
          
          if [ ! -d "drivers/kernelsu" ]; then
            sed -i '/kernelsu/d' drivers/Kconfig || true
          fi
          
          make O=out LawRun_defconfig
          
          # Inject ath9k htc wireless module support
          echo "CONFIG_ATH9K_HTC=m" >> out/.config

          make O=out olddefconfig
          make -j$(nproc --all) O=out modules KCFLAGS="-w" HOSTCFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/
          cd AnyKernel
          zip -r9 ../AnyKernel3-LawRun-beryllium.zip *
          
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-LawRun-beryllium
          path: AnyKernel3-LawRun-beryllium.zip
